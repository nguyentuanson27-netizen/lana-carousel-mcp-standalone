<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dự án Lana Carousel</title><style>
:root{--paper:#f4efe9;--card:#fffdfa;--ink:#251f1b;--muted:#746b64;--accent:#8d3f3d;--line:#ddd3ca}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui}.shell{max-width:1100px;margin:auto;padding:28px}h1{font:500 34px Georgia}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px}.grid{display:grid;gap:13px;margin-top:18px}.card{padding:18px;border-radius:17px;background:var(--card);display:grid;grid-template-columns:1fr auto;gap:14px}.card h2{margin:0 0 5px;font:500 22px Georgia}.muted{color:var(--muted)}.actions{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.btn{padding:8px 11px;border:0;border-radius:999px;color:#fff;background:var(--accent);text-decoration:none;cursor:pointer}.secondary{color:var(--ink);background:#e9e1da}.danger{background:#973d37}@media(max-width:700px){.card{grid-template-columns:1fr}.shell{padding:15px}}</style></head><body><main class="shell"><h1>Tất cả dự án</h1><input id="search" class="search" placeholder="Tìm theo tên hoặc chủ đề…"><div id="grid" class="grid"></div></main><script>
const grid=document.getElementById("grid"),search=document.getElementById("search");const esc=(v="")=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"})[c]);let timer;
async function load(){const r=await fetch(`/api/projects?search=${encodeURIComponent(search.value)}`),data=await r.json();grid.innerHTML=data.projects.map(p=>`<article class="card"><div><h2>${esc(p.title)}</h2><div class="muted">${esc(p.topic||"")}</div><small class="muted">Hết hạn: ${new Date(p.expiresAt.replace(" ","T")+"Z").toLocaleString("vi-VN")}</small></div><div class="actions"><a class="btn" href="${p.widgetUrl}">Mở</a><button class="btn secondary" data-clone="${p.id}">Nhân bản</button><button class="btn secondary" data-extend="${p.id}">+14 ngày</button><button class="btn danger" data-delete="${p.id}">Xóa</button></div></article>`).join("")||`<p class="muted">Không có dự án.</p>`}search.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,250)};grid.onclick=async e=>{const clone=e.target.closest("[data-clone]"),extend=e.target.closest("[data-extend]"),del=e.target.closest("[data-delete]");if(clone){e.target.disabled=true;const r=await fetch(`/api/projects/${clone.dataset.clone}/clone`,{method:"POST"}),p=await r.json();if(r.ok)location.href=p.widgetUrl;else alert(p.message)}if(extend){await fetch(`/api/projects/${extend.dataset.extend}/extend`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({days:14})});load()}if(del&&confirm("Xóa vĩnh viễn dự án này?")){await fetch(`/api/projects/${del.dataset.delete}`,{method:"DELETE"});load()}};load();
</script></body></html>
