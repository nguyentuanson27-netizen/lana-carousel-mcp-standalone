<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Đăng nhập Lana Content Studio</title>
  <style>
    :root{color-scheme:light;--paper:#f5f1eb;--card:#fffdf9;--ink:#2b221d;--muted:#796d64;--line:#ded4ca;--accent:#8d3f3d}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 0%,#ead8c7,transparent 35rem),var(--paper);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
    main{width:min(460px,100%);padding:30px;border:1px solid var(--line);border-radius:24px;background:var(--card);box-shadow:0 24px 80px #39261b1f}
    h1{margin:0 0 8px;font:500 32px Georgia,serif}p{margin:0 0 22px;color:var(--muted)}
    button{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:700 15px system-ui;cursor:pointer}
    button:hover{border-color:#bca99b;background:#fffaf7}button:disabled{opacity:.55}.error{min-height:22px;margin:12px 0 0;color:#a03935;font-size:13px}
    small{display:block;margin-top:14px;color:var(--muted)}.google{font-size:18px;font-weight:800;color:#4285f4}
  </style>
</head>
<body>
  <main>
    <h1>Lana Content Studio</h1>
    <p>Đăng nhập bằng tài khoản Google được cấp quyền để mở dashboard và Social Publisher.</p>
    <button id="googleLoginButton" type="button"><span class="google">G</span> Tiếp tục với Google</button>
    <p id="error" class="error" role="alert"></p>
    <small>Không cần nhập hoặc lưu API key trong trình duyệt. Phiên đăng nhập được lưu bằng cookie HttpOnly.</small>
  </main>
  <script type="module" src="/admin-auth.js"></script>
</body>
</html>
