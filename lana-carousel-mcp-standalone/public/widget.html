<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lana Carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700&family=Playfair+Display:wght@400;700&family=Poppins:wght@400;700&family=Roboto:wght@400;700&family=TikTok+Sans&display=swap" rel="stylesheet">
<style>
:root{--ink:#251f1b;--muted:#746b64;--paper:#f4efe9;--card:#fffdfa;--accent:#8d3f3d;--green:#39704a;--line:#ddd3ca}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:15px/1.5 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}.shell{max-width:1680px;margin:auto;padding:24px}.top,.card-head,.bar{display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{font:600 24px Georgia}.muted{color:var(--muted)}.workflow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:20px 0}.step{padding:13px;border:1px solid transparent;border-radius:13px;background:#fff9;cursor:pointer}.step.active{border-color:var(--accent);background:#fff}.step.done{color:var(--green)}.step:disabled{opacity:.45}.panel{display:none}.panel.active{display:grid;gap:18px}.card{padding:20px;border-radius:20px;background:var(--card);box-shadow:0 10px 35px #422b1c0b}.card h2{margin:3px 0 8px;font:500 24px Georgia}.number{color:var(--accent);font-size:12px;font-weight:800;text-transform:uppercase}.status{padding:5px 9px;border-radius:999px;background:#eee7e1;font-size:12px}.status.done{color:var(--green);background:#e8f3eb}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}.field{display:grid;gap:5px;color:var(--muted);font-size:12px}.field.wide{grid-column:span 2}.field input,.field textarea,.field select{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:75px}.action,.danger{border:0;border-radius:999px;padding:9px 15px;color:#fff;background:var(--accent);font-weight:700;cursor:pointer}.action:disabled{opacity:.4}.danger{background:#963c36}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px;margin-top:14px}.candidate{overflow:hidden;border:1px solid var(--line);border-radius:15px;background:#fff}.candidate.selected{border:2px solid var(--accent)}.candidate img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.candidate-actions{display:grid;gap:7px;padding:9px}.candidate-actions button{border:0;border-radius:9px;padding:8px;color:#fff;background:var(--accent);font-weight:700}.pick{font-size:12px;color:var(--muted)}.brand-kit{display:flex;flex-wrap:wrap;align-items:end;gap:10px}.brand-kit .field{min-width:180px}.visual{display:grid;grid-template-columns:minmax(480px,560px) minmax(0,1fr);gap:28px;align-items:start}.canvas{position:relative;width:min(560px,100%);aspect-ratio:9/16;overflow:hidden;border-radius:16px;background:#181411;touch-action:none;container-type:inline-size}.canvas-bg{position:absolute;inset:0;display:grid;overflow:hidden}.canvas-bg div{position:relative;overflow:hidden}.canvas-bg img{position:absolute;width:100%;height:100%;object-fit:cover}.safe-zone{position:absolute;inset:8% 8% 16%;border:1px dashed #fff9;pointer-events:none}.layer{position:absolute;box-sizing:border-box;max-width:96%;padding:5px 8px;font-weight:700;line-height:1.12;text-shadow:0 2px 5px #000,0 0 2px #000;transform:translate(-50%,-50%);cursor:grab;user-select:none;white-space:pre-wrap}.layer.active{outline:2px dashed #ffdf70}.tools{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px}.tool{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.range-value{font-weight:700;color:var(--ink)}.image-frame{position:absolute;z-index:2;border-style:solid;pointer-events:none}.editor-section{margin:14px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.text-style-controls{background:#f7f4ef}.selection-size-tools{padding:12px;border:1px dashed var(--line);border-radius:10px;background:#fff}.selection-size-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.selection-size-row input{width:90px}.selection-format-grid{display:grid;grid-template-columns:2fr 1fr 1.5fr 1fr;gap:8px;align-items:end;margin:8px 0}.selection-format-grid label{display:grid;gap:4px}.apply-targets{position:relative}.apply-targets>summary{list-style:none}.apply-targets>summary::-webkit-details-marker{display:none}.apply-target-menu{position:absolute;z-index:20;top:calc(100% + 6px);right:0;display:grid;gap:8px;width:min(390px,90vw);max-height:420px;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 14px 45px #28190f2b}.apply-target-actions{display:flex;gap:6px}.text-box-controls{background:#f4f7fa}.editor-section summary{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px;cursor:pointer;list-style:none;user-select:none}.editor-section summary::-webkit-details-marker{display:none}.editor-section summary:after{content:"›";font-size:24px;line-height:1;transition:transform .18s}.editor-section[open] summary:after{transform:rotate(90deg)}.section-meta{margin-left:auto;color:var(--muted);font-size:12px;font-weight:500}.section-body{padding:0 14px 14px;border-top:1px solid #0000000d}.box-presets{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}.toggle{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}.image-controls{background:#faf6f1}.control-title{display:flex;align-items:center;justify-content:space-between;gap:12px}.image-controls .fields{margin-bottom:0}.render-progress{height:12px;overflow:hidden;border-radius:999px;background:#e5ddd5}.render-progress span{display:block;height:100%;background:var(--accent);transition:width .3s}.hidden{display:none!important}.loading{min-height:60vh;display:grid;place-items:center}@media(max-width:1100px){.visual{grid-template-columns:1fr}.canvas{width:min(560px,100%);margin:auto}}@media(max-width:780px){.selection-format-grid{grid-template-columns:1fr 1fr}.shell{padding:13px}.workflow{grid-template-columns:1fr 1fr}.visual{grid-template-columns:1fr}.canvas{width:min(560px,100%);margin:auto}.fields{grid-template-columns:1fr}.field.wide{grid-column:auto}.candidate-grid{grid-template-columns:1fr 1fr}.top .muted{display:none}}
</style></head><body><main class="shell"><div id="loading" class="loading">Đang mở dự án…</div><div id="app" class="hidden"><header class="top"><div class="brand">Lana Carousel</div><div><a href="/projects" class="muted">Tất cả dự án</a> · <span id="meta" class="muted"></span></div></header><nav id="workflow" class="workflow"><button class="step" data-view="content">1. Duyệt nội dung</button><button class="step" data-view="images">2. Duyệt ảnh</button><button class="step" data-view="edit">3. Sửa ảnh</button><button class="step" data-view="download">4. Tải</button></nav><section id="content" class="panel"></section><section id="images" class="panel"></section><section id="edit" class="panel"></section><section id="download" class="panel"></section></div></main><script src="/widget.js?v=1.7.0"></script></body></html>
