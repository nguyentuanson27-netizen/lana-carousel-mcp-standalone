<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#8d3f3d">
  <title>Lana Content Studio</title>
  <link rel="stylesheet" href="/fonts.css?v=1.0.0">
  <link rel="stylesheet" href="/stitch-ui.css?v=1.1.0">
  <link rel="stylesheet" href="/stitch-layout.css?v=1.0.0">
  <link rel="stylesheet" href="/social-studio.css?v=1.0.0">
  <style>
    .workspace-header.compact-workspace-header{align-items:center;gap:18px;padding:12px 28px 10px}
    .workspace-header.compact-workspace-header h1{margin:2px 0 0}
  </style>
</head>
<body>
  <div id="loading" class="loading-screen">
    <div class="loading-mark">L</div>
    <div>
      <strong>Đang mở Lana Content Studio</strong>
      <span>Chuẩn bị nội dung, ảnh và công cụ video…</span>
    </div>
  </div>

  <div id="app" class="studio-app hidden">
    <header class="studio-topbar">
      <div class="topbar-leading">
        <button id="mobileSidebarToggle" class="icon-button mobile-only" type="button" aria-label="Mở quy trình và danh sách slide">
          <span aria-hidden="true">☰</span>
        </button>
        <a href="/projects" class="back-link" aria-label="Quay lại tất cả dự án">← <span>Tất cả dự án</span></a>
        <span class="topbar-divider" aria-hidden="true"></span>
        <div class="studio-wordmark">Lana Content Studio</div>
      </div>
      <div class="topbar-trailing">
        <span id="saveState" class="save-state"><i></i> Sẵn sàng</span>
        <span id="meta" class="project-meta"></span>
        <button id="nextWorkflowAction" class="primary-button compact" type="button">Tiếp tục</button>
      </div>
    </header>

    <div class="studio-body">
      <aside id="studioSidebar" class="studio-sidebar" aria-label="Quy trình Carousel">
        <div class="sidebar-brand">
          <span class="brand-mark">L</span>
          <div>
            <strong>Carousel Studio</strong>
            <span id="sidebarProjectName">Dự án nội dung</span>
          </div>
          <button id="sidebarClose" class="icon-button mobile-only" type="button" aria-label="Đóng thanh bên">×</button>
        </div>

        <div class="workflow-caption">Quy trình</div>
        <nav id="workflow" class="workflow-nav">
          <button class="step" data-view="content" type="button"><span>1</span><b>Duyệt nội dung</b><small>Nội dung từng slide</small></button>
          <button class="step" data-view="images" type="button"><span>2</span><b>Duyệt ảnh</b><small>Ảnh chính hoặc ghép lưới</small></button>
          <button class="step" data-view="edit" type="button"><span>3</span><b>Sửa thiết kế</b><small>Chữ, crop và Brand Kit</small></button>
          <button class="step" data-view="download" type="button"><span>4</span><b>Render & tải</b><small>Xuất bộ ảnh ZIP</small></button>
          <button class="step" data-view="video" type="button"><span>5</span><b>Video tùy chọn</b><small>Timeline, TTS và MP4</small></button>
          <button class="step social-step" data-view="social" type="button"><span>6</span><b>Đăng mạng xã hội</b><small>TikTok, Facebook, Instagram</small></button>
        </nav>

        <section id="slideNavigation" class="slide-navigation">
          <div class="slide-nav-head">
            <div>
              <span>Danh sách slide</span>
              <strong id="slideProgress">0 slide</strong>
            </div>
            <button id="slideNavCollapse" class="icon-button" type="button" aria-label="Thu gọn danh sách slide">−</button>
          </div>
          <label class="slide-search">
            <span aria-hidden="true">⌕</span>
            <input id="slideSearch" type="search" placeholder="Tìm slide…" autocomplete="off">
          </label>
          <div id="slideFilters" class="slide-filters">
            <button class="active" type="button" data-filter="all">Tất cả</button>
            <button type="button" data-filter="pending">Cần xử lý</button>
            <button type="button" data-filter="done">Hoàn tất</button>
          </div>
          <div id="slideRail" class="slide-rail" role="list"></div>
        </section>
      </aside>

      <main class="studio-main">
        <header class="workspace-header compact-workspace-header">
          <div>
            <span id="workspaceEyebrow" class="workspace-eyebrow">Bước 1 · Carousel</span>
            <h1 id="workspaceTitle">Duyệt nội dung</h1>
            <p id="workspaceDescription" class="hidden">Kiểm tra tiêu đề và nội dung trước khi chọn ảnh.</p>
          </div>
          <div id="workspaceStats" class="workspace-stats hidden"></div>
        </header>

        <div class="workspace-shell">
          <section id="content" class="panel workspace-panel"></section>
          <section id="images" class="panel workspace-panel"></section>
          <section id="edit" class="panel workspace-panel"></section>
          <section id="download" class="panel workspace-panel"></section>
          <section id="video" class="panel workspace-panel video-workspace"></section>
          <section id="social" class="panel workspace-panel social-workspace" aria-label="Đăng mạng xã hội"></section>
        </div>
      </main>

      <aside id="contextInspector" class="context-inspector" aria-label="Thông tin màn hình hiện tại">
        <div id="inspectorContent"></div>
      </aside>
    </div>

    <div id="mobileBackdrop" class="mobile-backdrop" hidden></div>
  </div>

  <script src="/widget.js?v=2.5.0"></script>
  <script src="/stitch-ui.js?v=1.1.0"></script>
  <script src="/studio-layout.js?v=1.0.0"></script>
  <script src="/social-studio.js?v=1.0.0"></script>
</body>
</html>
