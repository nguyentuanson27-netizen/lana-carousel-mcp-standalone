services:
  lana-carousel-http:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8787
      PUBLIC_BASE_URL: https://content.lanadesign.tech
      DATABASE_PATH: /app/data/lana-carousel.sqlite
      ASSET_DIRECTORY: /app/data/assets
      MAX_IMAGE_BYTES: 10485760
      IMAGE_TIMEOUT_MS: 15000
      MAX_REDIRECTS: 3
    ports:
      - "8787:8787"
    volumes:
      - ./data:/app/data
