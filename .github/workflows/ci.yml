name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lana-carousel-mcp-standalone
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lana-carousel-mcp-standalone/package-lock.json
      - run: npm ci
      # Chromium cho test parity giữa preview và ảnh render (src/preview-browser-parity.test.js).
      # Thiếu bước này thì bộ test đó tự bỏ qua thay vì fail.
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:remotion
