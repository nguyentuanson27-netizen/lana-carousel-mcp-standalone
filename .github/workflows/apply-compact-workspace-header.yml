name: Apply compact workspace header

on:
  push:
    branches:
      - fix/compact-workspace-step-header
    paths:
      - .github/workflows/apply-compact-workspace-header.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-workspace-step-header
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lana-carousel-mcp-standalone/package-lock.json
      - name: Apply UI changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          html_path = Path('lana-carousel-mcp-standalone/public/widget.html')
          html = html_path.read_text()
          old_header = '''        <header class="workspace-header">
          <div>
            <span id="workspaceEyebrow" class="workspace-eyebrow">Bước 1 · Carousel</span>
            <h1 id="workspaceTitle">Duyệt nội dung</h1>
            <p id="workspaceDescription">Kiểm tra tiêu đề và nội dung trước khi chọn ảnh.</p>
          </div>
          <div id="workspaceStats" class="workspace-stats"></div>
        </header>'''
          new_header = '''        <header class="workspace-header">
          <div>
            <span id="workspaceEyebrow" class="workspace-eyebrow">Bước 1 · Carousel</span>
            <h1 id="workspaceTitle">Duyệt nội dung</h1>
          </div>
        </header>'''
          if html.count(old_header) != 1:
              raise SystemExit('workspace header markup did not match exactly once')
          html = html.replace(old_header, new_header, 1)
          html = html.replace('/stitch-ui.css?v=1.1.0', '/stitch-ui.css?v=1.1.1')
          html = html.replace('/stitch-ui.js?v=1.1.0', '/stitch-ui.js?v=1.1.1')
          html_path.write_text(html)

          js_path = Path('lana-carousel-mcp-standalone/public/stitch-ui.js')
          js = js_path.read_text()
          old_update = '''    q('#workspaceEyebrow').textContent = meta.step;
    q('#workspaceTitle').textContent = meta.title;
    q('#workspaceDescription').textContent = meta.description;
    configureWorkflowAction(view);
    syncBrandKitPlacement(view);
    const done = items.filter(item => item.status === 'done').length;
    q('#workspaceStats').innerHTML = items.length
      ? `<span>${items.length} slide</span><span>${done} hoàn tất</span><span>${items.length - done} cần xử lý</span>`
      : view === 'video' ? '<span>Remotion</span><span>Timeline đa cảnh</span>' : '<span>Sẵn sàng render</span>';'''
          new_update = '''    q('#workspaceEyebrow').textContent = meta.step;
    q('#workspaceTitle').textContent = meta.title;
    configureWorkflowAction(view);
    syncBrandKitPlacement(view);'''
          if js.count(old_update) != 1:
              raise SystemExit('updateHeader block did not match exactly once')
          js_path.write_text(js.replace(old_update, new_update, 1))

          css_path = Path('lana-carousel-mcp-standalone/public/stitch-ui.css')
          css = css_path.read_text()
          old_css = ".studio-main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}.workspace-header{display:flex;align-items:end;justify-content:space-between;gap:24px;padding:22px 28px 18px;border-bottom:1px solid var(--line);background:var(--surface)}.workspace-eyebrow{color:var(--primary);font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.workspace-header h1{margin:4px 0 3px;font:600 28px Playfair Display,serif}.workspace-header p{margin:0;color:var(--muted)}.workspace-stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.workspace-stats span{padding:6px 9px;border:1px solid var(--line);border-radius:999px;background:var(--surface-alt);color:var(--muted);font-size:10px;font-weight:700}"
          new_css = ".studio-main{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}.workspace-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 28px 10px;border-bottom:1px solid var(--line);background:var(--surface)}.workspace-eyebrow{color:var(--primary);font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}.workspace-header h1{margin:2px 0 0;font:600 28px Playfair Display,serif}"
          if css.count(old_css) != 1:
              raise SystemExit('workspace header CSS did not match exactly once')
          css_path.write_text(css.replace(old_css, new_css, 1))
          PY
      - name: Validate
        working-directory: lana-carousel-mcp-standalone
        run: |
          npm ci
          npm run check
          npm run test:remotion
      - name: Commit final change
        shell: bash
        run: |
          rm .github/workflows/apply-compact-workspace-header.yml
          git config user.name "nguyentuanson27-netizen"
          git config user.email "nguyentuanson27@gmail.com"
          git add -A
          git commit -m "fix(ui): compact workspace step header"
          git push origin HEAD:fix/compact-workspace-step-header
