name: Apply uploaded UI improvements

on:
  push:
    branches:
      - feat/stitch-content-review-ui
    paths:
      - .github/workflows/apply-uploaded-ui-patch.yml

permissions:
  contents: write

concurrency:
  group: apply-uploaded-ui-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stitch-content-review-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lana-carousel-mcp-standalone/package-lock.json
      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/user-patches/lanauiimprovements.diff.gz.b64.* | base64 --decode | gzip --decompress > /tmp/lanauiimprovements.diff
          echo '6941b70a6ad4709014392094b31ee21deccc0aea835337c3edb1c3a150e51969  /tmp/lanauiimprovements.diff' | sha256sum --check --strict
          git apply --check /tmp/lanauiimprovements.diff
      - name: Apply UI changes
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/lanauiimprovements.diff
          rm -rf .github/user-patches
          rm -f .github/workflows/apply-uploaded-ui-patch.yml
      - name: Validate application
        working-directory: lana-carousel-mcp-standalone
        run: |
          npm ci
          npm run check
          npm run test:remotion
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(ui): improve studios and project navigation'
          git push origin HEAD:feat/stitch-content-review-ui
